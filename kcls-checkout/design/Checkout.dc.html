<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>KCLS Self-Checkout — Scan items</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#8c2231}a:hover{color:#5e1320}
</style>
</helmet>
<div style="width: 1920px; height: 1080px; box-sizing: border-box; display: flex; flex-direction: column; overflow: hidden; font-family: Inter, system-ui, sans-serif; background: #ffffff; color: #111111">

  <header style="position: relative; flex: none; height: 104px; background: #d8292e; display: flex; align-items: center; justify-content: center">
    <div style="position: absolute; left: 24px; top: 14px; display: flex; align-items: center; gap: 14px; padding: 12px 22px 12px 16px; background: #ffffff; color: #111111">
      <svg width="52" height="52" viewBox="0 0 52 52" aria-hidden="true"><rect width="52" height="52" rx="2" fill="#111111"></rect><path d="M10 40 L22 15 L29 29 L25 40 Z" fill="#ffffff"></path><path d="M27 40 L35 24 L43 40 Z" fill="#ffffff"></path><rect x="35" y="9" width="8" height="8" fill="#d8292e"></rect></svg>
      <div style="display: flex; flex-direction: column; font-weight: 700; font-size: 19px; line-height: 23px; white-space: nowrap"><span>King County</span><span>Library System</span></div>
    </div>
    <h1 style="margin: 0; color: #ffffff; font-weight: 800; font-size: 46px; letter-spacing: 1.5px; white-space: nowrap">CHECK OUT HERE</h1>
  </header>

  <main style="flex: 1 1 0; min-height: 0; box-sizing: border-box; display: flex; gap: 64px; padding: 52px 72px 44px">
    <section style="flex: 1 1 0; min-width: 0; display: flex; flex-direction: column; gap: 22px">
      <p style="margin: 0; color: #8c2231; font-weight: 800; font-size: 22px; letter-spacing: 1.6px; white-space: nowrap">SIGNED IN · CARD ENDING 8415</p>
      <h2 style="margin: 0; font-weight: 800; font-size: 56px; line-height: 1.1">Scan your items</h2>
      <p style="margin: 0; font-weight: 500; font-size: 28px; line-height: 38px; color: #3a3632">Place one item at a time on the scanner, barcode facing down.</p>

      <sc-if value="{{isEmpty}}" hint-placeholder-val="{{ true }}">
        <p style="margin: 8px 0 0; font-weight: 500; font-size: 26px; color: #6b6660">No items yet. Scan your first item to begin.</p>
      </sc-if>

      <div style="display: flex; flex-direction: column; gap: 14px; margin-top: 8px">
        <sc-for list="{{items}}" as="item" hint-placeholder-count="2">
          <div style="display: flex; align-items: center; justify-content: space-between; gap: 24px; padding: 20px 28px; background: #f3efea; border: 2px solid #d9d2c9; border-radius: 10px">
            <div style="display: flex; flex-direction: column; gap: 2px">
              <span style="font-weight: 700; font-size: 28px; line-height: 34px">{{item.title}}</span>
              <span style="font-weight: 500; font-size: 22px; color: #6b6660">{{item.author}}</span>
            </div>
            <span style="flex: none; font-weight: 700; font-size: 24px; color: #3a3632">Due {{item.due}}</span>
          </div>
        </sc-for>
      </div>
    </section>

    <aside style="flex: none; width: 520px; display: flex; flex-direction: column; gap: 28px; padding-top: 49px">
      <div style="display: flex; flex-direction: column; gap: 6px; padding: 28px; border: 3px solid #111111; border-radius: 14px; box-shadow: 0 6px 18px rgba(0,0,0,0.16)">
        <span style="color: #8c2231; font-weight: 800; font-size: 22px; letter-spacing: 1.6px">ITEMS CHECKED OUT</span>
        <span style="font-weight: 800; font-size: 96px; line-height: 1">{{count}}</span>
      </div>

      <button type="button" onClick="{{scan}}" style="box-sizing: border-box; display: inline-flex; align-items: center; justify-content: center; gap: 14px; width: 100%; height: 84px; background: #ffffff; color: #111111; border: 3px solid #111111; border-radius: 8px; font-family: inherit; font-weight: 700; font-size: 25px; cursor: pointer">
        <svg width="30" height="30" viewBox="0 0 30 30" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" aria-hidden="true"><path d="M3 9 V3 H9"></path><path d="M21 3 H27 V9"></path><path d="M27 21 V27 H21"></path><path d="M9 27 H3 V21"></path><path d="M9 10 V20"></path><path d="M13 10 V20"></path><path d="M17 10 V20"></path><path d="M21 10 V20"></path></svg>
        <span>Simulate scanning an item</span>
      </button>

      <a href="Receipt.dc.html" style="box-sizing: border-box; display: inline-flex; align-items: center; justify-content: center; width: 100%; height: 96px; background: #4c8c2b; border: 3px solid #3a6e20; border-radius: 8px; color: #ffffff; font-weight: 800; font-size: 32px; letter-spacing: 1.2px; text-decoration: none">DONE</a>
      <a href="Main.dc.html" style="box-sizing: border-box; display: inline-flex; align-items: center; justify-content: center; width: 100%; height: 96px; background: #e8c13c; border: 3px solid #c49c1e; border-radius: 8px; color: #111111; font-weight: 800; font-size: 32px; letter-spacing: 1.2px; text-decoration: none">CANCEL</a>
    </aside>
  </main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"startingItems":{"editor":"int","default":2,"min":0,"max":4},"$preview":{"width":1920,"height":1080}}'>
class Component extends DCLogic {
  renderVals() {
    const CATALOG = [
      { title: 'The Seattle Cookbook', author: 'Hannah Ortiz', loan: 21 },
      { title: 'Hiking the Cascades, 4th ed.', author: 'Pat Nguyen', loan: 21 },
      { title: 'Little Bear Goes to the Library', author: 'M. Reyes', loan: 14 },
      { title: 'Cedar & Salt (DVD)', author: 'Northwest Films', loan: 7 },
    ];
    const start = this.props.startingItems ?? 2;
    const n = Math.min(CATALOG.length, (this.state && this.state.n !== undefined) ? this.state.n : start);
    const fmt = (days) => {
      const d = new Date();
      d.setDate(d.getDate() + days);
      return d.toLocaleDateString('en-US', { month: 'short', day: 'numeric' });
    };
    return {
      items: CATALOG.slice(0, n).map((it) => ({ ...it, due: fmt(it.loan) })),
      count: n,
      isEmpty: n === 0,
      scan: () => this.setState({ n: Math.min(CATALOG.length, n + 1) }),
    };
  }
}
</script>
</body>
</html>
