<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>KCLS Self-Checkout — Receipt</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#8c2231}a:hover{color:#5e1320}
</style>
</helmet>
<div style="width: 1920px; height: 1080px; box-sizing: border-box; display: flex; flex-direction: column; overflow: hidden; font-family: Inter, system-ui, sans-serif; background: #ffffff; color: #111111">

  <header style="position: relative; flex: none; height: 104px; background: #d8292e; display: flex; align-items: center; justify-content: center">
    <div style="position: absolute; left: 24px; top: 14px; display: flex; align-items: center; gap: 14px; padding: 12px 22px 12px 16px; background: #ffffff; color: #111111">
      <svg width="52" height="52" viewBox="0 0 52 52" aria-hidden="true"><rect width="52" height="52" rx="2" fill="#111111"></rect><path d="M10 40 L22 15 L29 29 L25 40 Z" fill="#ffffff"></path><path d="M27 40 L35 24 L43 40 Z" fill="#ffffff"></path><rect x="35" y="9" width="8" height="8" fill="#d8292e"></rect></svg>
      <div style="display: flex; flex-direction: column; font-weight: 700; font-size: 19px; line-height: 23px; white-space: nowrap"><span>King County</span><span>Library System</span></div>
    </div>
    <h1 style="margin: 0; color: #ffffff; font-weight: 800; font-size: 46px; letter-spacing: 1.5px; white-space: nowrap">THANK YOU</h1>
  </header>

  <main style="flex: 1 1 0; min-height: 0; box-sizing: border-box; display: flex; align-items: center; justify-content: center; padding: 52px 72px 44px">
    <div style="display: flex; flex-direction: column; align-items: center; gap: 28px; max-width: 1200px; text-align: center">
      <div style="display: flex; align-items: center; justify-content: center; width: 120px; height: 120px; border-radius: 50%; background: #4c8c2b">
        <svg width="64" height="64" viewBox="0 0 64 64" fill="none" stroke="#ffffff" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14 33 L27 46 L51 19"></path></svg>
      </div>

      <sc-if value="{{choosing}}" hint-placeholder-val="{{ true }}">
        <div style="display: flex; flex-direction: column; align-items: center; gap: 28px">
          <h2 style="margin: 0; font-weight: 800; font-size: 56px; line-height: 1.1">You’re all set!</h2>
          <p style="margin: 0; padding: 18px 28px; background: #f3efea; border: 2px solid #d9d2c9; border-radius: 10px; font-weight: 500; font-size: 26px; line-height: 36px">2 items checked out. Earliest due date: {{due}}.</p>
          <p style="margin: 0; font-weight: 500; font-size: 28px; line-height: 38px; color: #3a3632">Would you like a receipt?</p>
          <div style="display: flex; align-items: center; gap: 20px">
            <button type="button" onClick="{{pickPrint}}" style="box-sizing: border-box; width: 300px; height: 96px; background: #4c8c2b; border: 3px solid #3a6e20; border-radius: 8px; color: #ffffff; font-family: inherit; font-weight: 800; font-size: 32px; letter-spacing: 1.2px; cursor: pointer">PRINT</button>
            <button type="button" onClick="{{pickEmail}}" style="box-sizing: border-box; width: 300px; height: 96px; background: #ffffff; border: 3px solid #111111; border-radius: 8px; color: #111111; font-family: inherit; font-weight: 800; font-size: 32px; letter-spacing: 1.2px; cursor: pointer">EMAIL</button>
            <button type="button" onClick="{{pickNone}}" style="box-sizing: border-box; width: 300px; height: 96px; background: #e8c13c; border: 3px solid #c49c1e; border-radius: 8px; color: #111111; font-family: inherit; font-weight: 800; font-size: 32px; letter-spacing: 1.2px; cursor: pointer">NO RECEIPT</button>
          </div>
        </div>
      </sc-if>

      <sc-if value="{{done}}" hint-placeholder-val="{{ false }}">
        <div style="display: flex; flex-direction: column; align-items: center; gap: 28px">
          <h2 style="margin: 0; font-weight: 800; font-size: 56px; line-height: 1.1">Thank you!</h2>
          <p style="margin: 0; font-weight: 500; font-size: 28px; line-height: 38px; color: #3a3632">{{message}}</p>
          <a href="Main.dc.html" style="box-sizing: border-box; display: inline-flex; align-items: center; justify-content: center; height: 96px; padding: 0 48px; background: #4c8c2b; border: 3px solid #3a6e20; border-radius: 8px; color: #ffffff; font-weight: 800; font-size: 32px; letter-spacing: 1.2px; text-decoration: none">START OVER</a>
        </div>
      </sc-if>
    </div>
  </main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1920,"height":1080}}'>
class Component extends DCLogic {
  renderVals() {
    const how = this.state && this.state.how;
    const d = new Date();
    d.setDate(d.getDate() + 21);
    const messages = {
      print: 'Your receipt is printing.',
      email: 'Your receipt is on its way to your email.',
      none: 'No receipt — enjoy your items.',
    };
    return {
      choosing: !how,
      done: !!how,
      due: d.toLocaleDateString('en-US', { month: 'short', day: 'numeric' }),
      message: how ? messages[how] : '',
      pickPrint: () => this.setState({ how: 'print' }),
      pickEmail: () => this.setState({ how: 'email' }),
      pickNone: () => this.setState({ how: 'none' }),
    };
  }
}
</script>
</body>
</html>
